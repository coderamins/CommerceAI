name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore CommerceAI.slnx

      - name: Build
        run: dotnet build CommerceAI.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test CommerceAI.slnx --no-build --configuration Release

      - name: Integration tests
        run: dotnet test tests/CommerceAI.IntegrationTests/CommerceAI.IntegrationTests.csproj --no-build --configuration Release